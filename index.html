<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFF Generator</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:18px}.card{max-width:600px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}
video{width:100%;border-radius:14px;background:#111;aspect-ratio:4/3;object-fit:cover}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769aa;color:#fff;font-size:18px;margin-top:12px}
#reading{font-size:42px;font-weight:bold;text-align:center;margin:20px}.status{text-align:center;color:#555}
</style></head><body><div class="card">
<h1>⚡ SFF Generator</h1><p>اختبار الكاميرا</p><video id="video" autoplay playsinline></video>
<div id="reading">—</div><div class="status" id="status">اضغط تشغيل الكاميرا</div>
<button id="start">تشغيل الكاميرا</button></div>
<script>
start.onclick=async()=>{try{video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});status.textContent="الكاميرا تعمل — وجّهها نحو العداد"}catch(e){status.textContent="تعذر تشغيل الكاميرا"}};
</script></body></html>
