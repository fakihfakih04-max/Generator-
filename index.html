<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFF Generator</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:Arial;background:#f3f5f7;padding:14px} .card{max-width:650px;margin:auto;background:white;border-radius:18px;padding:16px} video,img{width:100%;border-radius:14px}img{display:none;margin-top:12px}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#1877b9;color:white;font-size:18px}#reading{text-align:center;font-size:48px;font-weight:bold;margin:12px}#status{text-align:center;color:#555}.cam{position:relative}.frame{position:absolute;left:6%;right:6%;top:25%;height:38%;border:3px solid #00c96b;border-radius:10px}</style></head><body><div class="card"><h2>⚡ SFF Generator</h2><p style="text-align:center">ثبّت أرقام العداد داخل المربع الأخضر</p><div class="cam"><video id="video" autoplay playsinline muted></video><div class="frame"></div></div><div id="reading">—</div><div id="status">اضغط تشغيل الكاميرا</div><button id="start">تشغيل الكاميرا</button><img id="photo"></div><script>
const video=document.getElementById('video'),photo=document.getElementById('photo'),status=document.getElementById('status'),reading=document.getElementById('reading');let stream,worker,captured=false;
start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();status.textContent='ثبّت الهاتف... سيتم التقاط صورة واحدة تلقائياً';setTimeout(capture,2500)}catch(e){status.textContent='تعذر تشغيل الكاميرا'}};
async function capture(){if(captured||!video.videoWidth)return;captured=true;status.textContent='📸 عم نلتقط صورة واحدة...';let c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.95);photo.src=data;photo.style.display='block';try{localStorage.setItem('SFF_METER_PHOTO',data)}catch(e){}status.textContent='✓ الصورة انحفظت — جاري قراءة الرقم...';try{worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'6'});let r=await worker.recognize(c),n=r.data.text.match(/\d{4,7}/g)||[];if(n.length){reading.textContent=n[0];status.textContent='✓ تمّت قراءة الصورة'}else status.textContent='الصورة محفوظة، لكن الرقم غير واضح'}catch(e){status.textContent='الصورة محفوظة، حدث خطأ في OCR'}} 
</script></body></html>
