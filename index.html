<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFF Meter Reader</title>
<style>
body{margin:0;background:#f3f5f7;font-family:Arial;color:#111;padding:14px}
.card{max-width:650px;margin:auto;background:white;border-radius:18px;padding:16px;box-shadow:0 3px 16px #0002}
h2{margin:0 0 8px}.hint{font-size:14px;color:#555;line-height:1.5}
input{width:100%;margin:14px 0;font-size:16px}
img,canvas{width:100%;border-radius:12px;background:#ddd;margin-top:8px}
.result{margin-top:12px;text-align:center;background:#eef8ef;border-radius:14px;padding:14px}
.big{font-size:38px;font-weight:800;letter-spacing:3px}
.status{margin-top:7px;color:#555}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#111;color:white;font-size:17px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>⚡ قارئ عداد الكهرباء</h2>
<div class="hint">صوّر العداد. ما في زر قراءة. بعد الصورة مباشرة نحدد نافذة الأرقام ونقرأ الخانات.</div>
<input id="pick" type="file" accept="image/*" capture="environment">
<img id="photo" hidden>
<div class="status" id="status">بانتظار صورة العداد…</div>
<canvas id="reg" hidden></canvas>
<div class="result">
<div>Current Reading</div>
<div class="big" id="result">—</div>
</div>
<button id="again" hidden>صوّر من جديد</button>
</div>

<script>
const pick=document.getElementById('pick'), photo=document.getElementById('photo');
const reg=document.getElementById('reg'), status=document.getElementById('status');
const result=document.getElementById('result'), again=document.getElementById('again');

const P={
'0':'ab cdef'.replace(/ /g,''),'1':'bc','2':'abdeg','3':'abcdg',
'4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'
};

function gray(r,g,b){return .299*r+.587*g+.114*b}
function isRegister(r,g,b){
  const y=gray(r,g,b);
  const red=r>90 && r>g*1.35 && r>b*1.25;
  return y<105 || red;
}
function findBand(ctx,w,h){
  const d=ctx.getImageData(0,0,w,h).data;
  const ys=new Array(h).fill(0);
  for(let y=0;y<h;y++){
    let n=0;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(isRegister(d[i],d[i+1],d[i+2])) n++;
    }
    ys[y]=n/w;
  }
  // Find the strongest horizontal dark/red strip, avoiding tiny text rows.
  let best=null,start=-1;
  for(let y=0;y<h;y++){
    if(ys[y]>.18){ if(start<0)start=y; }
    else if(start>=0){
      const end=y;
      if(end-start>=Math.max(12,h*.015)){
        let sum=0;for(let k=start;k<end;k++)sum+=ys[k];
        const score=sum/(end-start);
        if(!best||score>best.score)best={start,end,score};
      }
      start=-1;
    }
  }
  if(!best)return null;
  let y0=Math.max(0,best.start-Math.round((best.end-best.start)*.12));
  let y1=Math.min(h,best.end+Math.round((best.end-best.start)*.12));
  // Find x span inside the selected band.
  const xScore=[];
  for(let x=0;x<w;x++){
    let n=0;
    for(let y=y0;y<y1;y++){
      const i=(y*w+x)*4;
      if(isRegister(d[i],d[i+1],d[i+2]))n++;
    }
    xScore[x]=n/(y1-y0);
  }
  let xs=-1,xe=-1;
  for(let x=0;x<w;x++){
    if(xScore[x]>.28){if(xs<0)xs=x;xe=x;}
  }
  if(xs<0)return null;
  xs=Math.max(0,xs-Math.round(w*.01)); xe=Math.min(w,xe+Math.round(w*.01));
  return {x0:xs,y0,x1:xe,y1};
}
function cropBand(img){
  const maxW=1400;
  const scale=Math.min(1,maxW/img.naturalWidth);
  const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  const b=findBand(ctx,w,h);
  if(!b)return null;
  const padX=Math.round((b.x1-b.x0)*.02),padY=Math.round((b.y1-b.y0)*.15);
  const out=document.createElement('canvas');
  out.width=Math.max(600,b.x1-b.x0+padX*2);
  out.height=Math.max(180,b.y1-b.y0+padY*2);
  const o=out.getContext('2d');
  o.drawImage(c,b.x0-padX,b.y0-padY,b.x1-b.x0+padX*2,b.y1-b.y0+padY*2,0,0,out.width,out.height);
  return out;
}
function readDigit(data,w,h,x0,x1){
  // White digit strokes on dark wheel. Sample seven segment zones.
  const boxes={
    a:[.18,.08,.82,.24], g:[.18,.42,.82,.58], d:[.18,.76,.82,.94],
    f:[.05,.16,.28,.48], b:[.72,.16,.95,.48], e:[.05,.52,.28,.84], c:[.72,.52,.95,.84]
  };
  const occ={};
  for(const k in boxes){
    const q=boxes[k],xa=Math.floor(x0+(x1-x0)*q[0]),xb=Math.floor(x0+(x1-x0)*q[2]);
    const ya=Math.floor(h*q[1]),yb=Math.floor(h*q[3]);
    let n=0,on=0;
    for(let y=ya;y<yb;y+=2)for(let x=xa;x<xb;x+=2){
      const i=(y*w+x)*4, v=gray(data[i],data[i+1],data[i+2]);
      // bright strokes
      if(v>145)n++; else n++;
      if(v>145)on++;
    }
    occ[k]=on/n;
  }
  let best={digit:'?',score:-1};
  for(const digit in P){
    let s=0;
    for(const k of 'abcdefg'){
      const want=P[digit].includes(k);
      const v=occ[k];
      s += want ? v : (1-v);
    }
    if(s>best.score)best={digit,score:s};
  }
  return best;
}
function readRegister(c){
  const ctx=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height;
  const data=ctx.getImageData(0,0,w,h).data;
  // The common register has 5 black wheels + 1 red tenth wheel.
  const n=6, digs=[];
  for(let i=0;i<n;i++){
    const x0=Math.floor(w*i/n),x1=Math.floor(w*(i+1)/n);
    digs.push(readDigit(data,w,h,x0,x1));
  }
  let s=digs.map(x=>x.digit).join('');
  if(s.length===6 && !s.includes('?')) return s.slice(0,5)+'.'+s[5];
  return s;
}
async function process(file){
  status.textContent='تم استلام الصورة ✓ عم دور على نافذة الأرقام…';
  result.textContent='—';
  const url=URL.createObjectURL(file);photo.src=url;photo.hidden=false;
  await new Promise(r=>photo.onload=r);
  const band=cropBand(photo);
  if(!band){
    status.textContent='ما لقيت نافذة الأرقام. قرّب العداد وخلي الأرقام واضحة.';
    return;
  }
  reg.width=band.width;reg.height=band.height;
  reg.getContext('2d').drawImage(band,0,0);
  reg.hidden=false;
  status.textContent='لقيت نافذة الأرقام ✓ عم أقرأ الخانات…';
  // Let the UI update before processing.
  await new Promise(r=>setTimeout(r,50));
  const reading=readRegister(band);
  result.textContent=reading;
  status.textContent=reading.includes('?')?'لقينا النافذة لكن بعض الخانات غير واضحة.':'تمت القراءة — راجع الرقم قبل الحفظ.';
  again.hidden=false;
}
pick.addEventListener('change',()=>{const f=pick.files&&pick.files[0];if(f)process(f)});
again.onclick=()=>{pick.value='';photo.hidden=true;reg.hidden=true;result.textContent='—';again.hidden=true;status.textContent='بانتظار صورة العداد…'};
</script>
</body>
</html>
