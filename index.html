<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFF Meter OCR Test 4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font-family:Arial,sans-serif}
header{background:#172033;color:#fff;text-align:center;padding:16px;font-size:21px;font-weight:bold}
.wrap{max-width:700px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 3px 15px #0001}
.camera{position:relative;background:#000;border-radius:15px;overflow:hidden;height:400px}
video{width:100%;height:100%;object-fit:cover}.target{position:absolute;border:4px solid #22c55e;border-radius:8px;display:none;pointer-events:none}
.status{text-align:center;background:#eaf3ff;color:#172033;padding:12px;border-radius:12px;font-weight:bold}
.result{text-align:center}.number{font-size:48px;font-weight:bold;color:#16a34a;padding:8px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:11px;font-size:17px;font-weight:bold}
.start{background:#16a34a;color:#fff}.stop{background:#ef4444;color:#fff}
.hint{font-size:14px;color:#64748b;line-height:1.7}
</style>
</head>
<body>
<header>⚡ SFF — Test 4: اكتشاف شاشة العداد تلقائياً</header>
<div class="wrap">
<div class="card">
<div class="camera" id="cameraBox">
<video id="video" autoplay playsinline muted></video>
<div id="target" class="target"></div>
</div>
<div id="status" class="status">اضغط تشغيل — ما في زر تصوير</div>
<button class="start" onclick="startCamera()">تشغيل الكاميرا والقراءة التلقائية</button>
<button class="stop" onclick="stopCamera()">إيقاف</button>
</div>
<div class="card result">
<div>القراءة الحالية</div>
<div id="reading" class="number">------</div>
<div class="hint">النظام يحاول أولاً تحديد مستطيل شاشة العداد، ثم يرسل هذه المنطقة فقط إلى OCR. الكتابة تحت الشاشة لا يفترض أن تدخل بالقراءة.</div>
</div>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const video=document.getElementById('video'), box=document.getElementById('cameraBox');
const target=document.getElementById('target'), status=document.getElementById('status'), reading=document.getElementById('reading');
let stream=null,busy=false,timer=null;

function setStatus(s){status.textContent=s}

function mapCropToScreen(r){
  const ew=video.clientWidth, eh=video.clientHeight, vw=video.videoWidth, vh=video.videoHeight;
  const scale=Math.max(ew/vw,eh/vh), dw=vw*scale, dh=vh*scale, ox=(ew-dw)/2, oy=(eh-dh)/2;
  target.style.left=(ox+r.x*scale)+'px'; target.style.top=(oy+r.y*scale)+'px';
  target.style.width=(r.w*scale)+'px'; target.style.height=(r.h*scale)+'px'; target.style.display='block';
}

function findDisplay(){
  const vw=video.videoWidth,vh=video.videoHeight;
  const c=document.createElement('canvas'); c.width=vw;c.height=vh;
  const ctx=c.getContext('2d');ctx.drawImage(video,0,0,vw,vh);
  if(typeof cv==='undefined'||!cv.Mat)return null;
  const src=cv.imread(c), gray=new cv.Mat(), bw=new cv.Mat(), contours=new cv.MatVector(), hier=new cv.Mat();
  let best=null,bestScore=-1;
  try{
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
    cv.Canny(gray,bw,60,160);
    cv.findContours(bw,contours,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
    for(let i=0;i<contours.size();i++){
      const cnt=contours.get(i), rect=cv.boundingRect(cnt);
      const area=rect.width*rect.height, ratio=rect.width/Math.max(1,rect.height);
      const fill=area/(vw*vh);
      // A meter register is a horizontal, fairly wide rectangle.
      if(rect.width<vw*.18 || rect.height<vh*.025 || ratio<2.0 || ratio>12) {cnt.delete();continue}
      if(fill<.006 || fill>.45){cnt.delete();continue}
      const cx=rect.x+rect.width/2, cy=rect.y+rect.height/2;
      // Prefer the upper/middle part of the meter, not serial text near bottom.
      const vertical=Math.max(0,1-Math.abs(cy/vh-.40)/.38);
      const score=ratio*1.2 + vertical*3 + Math.min(rect.width/vw,.8)*2;
      if(score>bestScore){bestScore=score;best={x:Math.max(0,rect.x-10),y:Math.max(0,rect.y-10),w:Math.min(vw-rect.x+10,rect.width+20),h:Math.min(vh-rect.y+10,rect.height+20)}}
      cnt.delete();
    }
  }catch(e){} finally{src.delete();gray.delete();bw.delete();contours.delete();hier.delete()}
  return best;
}

function cleanCandidates(text){
  const t=text.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/[Ss]/g,'5').replace(/[Bb]/g,'8');
  return (t.match(/\d+/g)||[]).filter(x=>x.length>=4&&x.length<=7);
}

async function readFrame(){
 if(!stream||busy)return;
 busy=true;
 try{
  const r=findDisplay();
  if(!r){
    setStatus('🔎 عم دور على شاشة الأرقام...');
    busy=false;return schedule();
  }
  mapCropToScreen(r);
  const c=document.createElement('canvas');
  // Add a little padding but keep the crop tight.
  const vw=video.videoWidth,vh=video.videoHeight;
  const x=Math.max(0,r.x),y=Math.max(0,r.y),w=Math.min(vw-x,r.w),h=Math.min(vh-y,r.h);
  c.width=Math.max(500,Math.floor(w*2.4));c.height=Math.max(180,Math.floor(h*2.4));
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(video,x,y,w,h,0,0,c.width,c.height);

  setStatus('⏳ شاشة العداد محددة — عم نقرأ الأرقام...');
  const out=await Tesseract.recognize(c,'eng',{
    config:{tessedit_char_whitelist:'0123456789'}
  });
  const cs=cleanCandidates(out.data.text||'');
  if(cs.length){
    // Avoid common technical markings.
    const bad=new Set(['100','1000','1600','230','50','60','21','62053']);
    const good=cs.filter(v=>!bad.has(v));
    if(good.length){
      // If a six-digit result is found, it is often 5 wheels + red tenth.
      const six=good.find(v=>v.length===6);
      const chosen=six||good.sort((a,b)=>b.length-a.length)[0];
      reading.textContent=chosen;
      setStatus('✅ قراءة الشاشة: '+chosen);
    }
  } else setStatus('📷 الشاشة محددة — قرّب العداد وثبّت الهاتف');
 }catch(e){setStatus('⚠️ محاولة قراءة جديدة...')}
 busy=false;
 schedule();
}

function schedule(){if(stream&&!timer)timer=setTimeout(()=>{timer=null;readFrame()},1200)}

async function startCamera(){
 try{
  stopCamera(false);
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;
  setStatus('✅ الكاميرا تعمل — عم أبحث تلقائياً عن شاشة الأرقام');
  setTimeout(readFrame,1500);
 }catch(e){setStatus('❌ تعذّر تشغيل الكاميرا: '+e.message)}
}
function stopCamera(show=true){
 if(timer){clearTimeout(timer);timer=null}
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;target.style.display='none';
 if(show)setStatus('تم إيقاف الكاميرا');
}
</script>
</body>
</html>
