<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بلدية صريفا</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;font-family:Arial;color:#17231f}.app{max-width:480px;margin:auto;background:#fff;min-height:100vh}.head{background:linear-gradient(145deg,#087b52,#13a36e);color:white;padding:22px 18px;border-radius:0 0 28px 28px}.top{display:flex;align-items:center;gap:12px}.logo{width:62px;height:62px;border-radius:50%;background:white;display:grid;place-items:center;font-size:30px}.brand{flex:1}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0}.scan{margin:18px;background:white;padding:12px;border-radius:24px;box-shadow:0 5px 22px #0001}.camera{height:245px;border-radius:18px;background:#26332f;display:grid;place-items:center;position:relative}.meter{width:78%;height:110px;background:#d7d5c8;border:7px solid #888;border-radius:12px;position:relative}.digits{position:absolute;left:10%;right:10%;top:25px;height:53px;background:#151918;color:white;display:flex;align-items:center;justify-content:center;font:34px monospace;letter-spacing:5px}.digits b{color:#e33}.labels{position:absolute;top:80px;left:12%;font-size:8px}.frame{position:absolute;inset:28px 9%;border:4px solid #20d58e;border-radius:14px}.center{text-align:center}.sub{color:#77817d;font-size:13px}.btn{width:100%;border:0;border-radius:17px;padding:16px;background:#13a36e;color:white;font-size:18px;font-weight:bold;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}.tile{border:0;background:#f1f5f4;border-radius:20px;padding:18px 8px;min-height:112px}.tile .i{font-size:29px}.tile strong,.tile span{display:block}.tile span{color:#75807b;font-size:12px;margin-top:5px}.footer{margin:18px;padding:15px;border-radius:20px;background:#e9f8ef;color:#087b52;text-align:center;font-weight:bold}
</style></head><body><main class="app"><header class="head"><div class="top"><div class="logo">🌲</div><div class="brand"><h1>بلدية صريفا</h1><p>خدمة كهرباء المولدات</p></div><div>⚙️</div></div></header><section class="scan"><div class="camera"><div class="meter"><div class="digits">00000 <b>2</b></div><div class="labels">10000　1000　100　10　1　0.1</div></div><div class="frame"></div></div><h3 class="center">وجّه الكاميرا على أرقام العداد</h3><div class="center sub">سيتم قراءة الرقم تلقائياً</div><button class="btn">📷 مسح العداد</button></section><div class="grid"><button class="tile"><div class="i">👥</div><strong>الزبائن</strong><span>إدارة الزبائن</span></button><button class="tile"><div class="i">📄</div><strong>الفواتير</strong><span>عرض وطباعة</span></button><button class="tile"><div class="i">📊</div><strong>التقارير</strong><span>إحصائيات مفصلة</span></button><button class="tile"><div class="i">💰</div><strong>الدفعات</strong><span>تسجيل الدفعات</span></button></div><div class="footer">💡 صريفا ... دائماً مضاءة 🌿</div></main></body></html>
