<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFF Generator - Auto Meter Capture</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:14px}
.card{max-width:650px;margin:auto;background:#fff;padding:16px;border-radius:18px}
h2{text-align:center;margin:5px}.box{position:relative}
video,canvas{width:100%;border-radius:14px;background:#111;display:block}
canvas{display:none}.frame{position:absolute;left:7%;right:7%;top:28%;height:30%;border:3px solid #00c96b;border-radius:9px;pointer-events:none}
#shot{margin-top:12px;display:none}.reading{text-align:center;font-size:48px;font-weight:bold;margin:12px}
.status{text-align:center;color:#555;min-height:25px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#1877b9;color:white;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h2>⚡ SFF Generator</h2>
<p style="text-align:center">وجّه المربع الأخضر على أرقام العداد</p>
<div class="box">
<video id="video" autoplay playsinline muted></video>
<div class="frame"></div>
</div>
<canvas id="work"></canvas>
<img id="shot" alt="آخر لقطة تلقائية">
<div id="reading" class="reading">—</div>
<div id="status" class="status">اضغط تشغيل الكاميرا</div>
<button id="start">تشغيل الكاميرا</button>
</div>
<script>
const video=document.getElementById('video'), work=document.getElementById('work');
const shot=document.getElementById('shot'), reading=document.getElementById('reading');
const status=document.getElementById('status');
let stream,worker,busy=false,running=false,last="",stable=0;

document.getElementById('start').onclick=async()=>{
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
   audio:false
  });
  video.srcObject=stream; await video.play();
  status.textContent="جاري تجهيز القراءة التلقائية…";
  worker=await Tesseract.createWorker("eng");
  await worker.setParameters({tessedit_char_whitelist:"0123456789",tessedit_pageseg_mode:"7"});
  running=true;
  status.textContent="جاهز — عم نلقط فريمات تلقائياً";
  autoCapture();
 }catch(e){status.textContent="الكاميرا أو OCR لم يعمل: "+e.message}
};

async function autoCapture(){
 if(!running)return;
 if(!busy && video.videoWidth){
  busy=true;
  const vw=video.videoWidth,vh=video.videoHeight;
  const sx=Math.floor(vw*.07),sy=Math.floor(vh*.28);
  const sw=Math.floor(vw*.86),sh=Math.floor(vh*.30);
  work.width=sw*2;work.height=sh*2;
  const ctx=work.getContext("2d");
  ctx.filter="grayscale(1) contrast(1.8) brightness(1.1)";
  ctx.drawImage(video,sx,sy,sw,sh,0,0,work.width,work.height);

  shot.src=work.toDataURL("image/jpeg",.85);
  shot.style.display="block";
  status.textContent="📸 لقطة تلقائية — عم نقرأها…";

  try{
   const r=await worker.recognize(work);
   const d=(r.data.text||"").replace(/\D/g,"");
   if(d.length>=4 && d.length<=7){
    if(d===last)stable++;else{last=d;stable=1}
    if(stable>=2){reading.textContent=d;status.textContent="✓ القراءة ثابتة";}
   }else status.textContent="📸 لقطة موجودة — الرقم غير واضح بعد";
  }catch(e){console.log(e)}
  busy=false;
 }
 setTimeout(autoCapture,900);
}
</script>
</body></html>
